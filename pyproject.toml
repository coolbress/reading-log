[project]
name = "reading_log"
version = "0.1.0"
description = "One line saying what this is"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "coolbress" }]
dependencies = [
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.52.4",
]

# Distribution metadata. Read by `pip show`, GitHub and the dependency graph
# even when the package is never uploaded.
[project.urls]
Homepage = "https://github.com/coolbress/reading-log"
Issues = "https://github.com/coolbress/reading-log/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "mypy>=1.14",
    "pytest>=8.3",
    "ruff>=0.9",
]

# Linter and formatter. The configuration is committed; CI runs `ruff check`
# and `ruff format --check` as `ci / lint`.
[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "A", "C4", "PT", "SIM", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's parameter-default calls (`Form(...)`, `Depends(...)`) are read by
# FastAPI itself at request time; they are not the mutable-default footgun B008 checks for.
extend-immutable-calls = ["fastapi.Form"]

[tool.ruff.lint.per-file-ignores]
# assert is the normal form in tests
"tests/**" = ["S101"]

# Type checking, `ci / typecheck`.
[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

# Tests, `ci / test`.
[tool.pytest.ini_options]
testpaths = ["tests"]
# No silent failures: an unregistered `@pytest.mark.foo` is a no-op even when
# it is a typo, and a misspelt key in this section is ignored. Both are made
# errors.
addopts = ["--strict-markers", "--strict-config"]
# Warnings are errors. A third-party warning that blocks gets one narrow
# ignore here, with its reason.
filterwarnings = [
    "error",
    # starlette.testclient imports anyio.abc.BlockingPortal, a name anyio kept
    # only as a deprecated alias; ours to drop once starlette imports the new one.
    "ignore:The anyio\\.abc\\.BlockingPortal alias is deprecated.*:DeprecationWarning:starlette.testclient",
]
